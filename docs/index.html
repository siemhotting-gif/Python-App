const REFD=[`
if cond: ... :: run the block only when cond is True
elif cond: ... :: extra condition, only checked if the earlier ones were False
else: ... :: runs when none of the conditions was True
== != < > <= >= :: comparison, the result is True or False
a < x <= b :: chained comparison (same as a < x and x <= b)
and / or / not :: both True / at least one True / flips the value. Order: not, and, or
x in seq / x not in seq :: membership test for strings, lists, tuples, sets and dict keys
x is None / x is not None :: identity test, mostly used with None
A if cond else B :: one-line conditional expression
bool(x) :: truthiness: 0, 0.0, "", [], (), {}, set() and None are False, everything else is True
x % 2 == 0 :: even number test (remainder of the division by 2)
isinstance(x, int) :: True if x has that type
text.isdigit() / text.isalpha() :: True if the text only has digits / only letters
text.lower() / text.upper() / text.strip() :: clean up text before comparing it
text.startswith("p") / text.endswith("s") :: check the beginning / end of a text
`,`
if a: (if b: ...) :: the inner if only runs when a was True
else (inside) :: belongs to the if at the same indentation
indentation :: 4 spaces per level; it decides which block a line belongs to
if a and b: :: replaces a nested if when there is no else in between
x = x // 4 + 3 :: lines before the if may change values, trace them first
pass :: placeholder for an empty block
// and % :: floor division and remainder, used a lot in conditions
min(a, b, c) / max(a, b, c) :: smallest / largest of several values
abs(x) :: absolute value
print(...) in a branch :: only the branch that is entered prints; trace one path at a time
`,`
match value: :: start a match statement on one value
case 1: :: matches when value == 1
case 1 | 2: :: matches 1 or 2
case _: :: wildcard, matches anything (the default)
case x: :: capture pattern: matches anything and stores it in x
case n if n > 5: :: guard: the pattern must match and the condition must be True
case "a": :: string literal pattern
case (x, y): :: tuple pattern (lists work too: [x, y])
case [first, *rest]: :: sequence pattern, * collects the rest
case {"k": v}: :: mapping pattern: key "k" must exist, its value is stored in v
case 0 | 1 if cond: :: or-pattern combined with a guard
only the first matching case runs :: there is no break and no fall-through
cmd.lower() :: match on a cleaned value, e.g. match cmd.lower():
`,`
for x in seq: :: loop over each item of a list, tuple, set, string, dict (keys), range or file
range(stop) :: 0 up to stop - 1
range(start, stop) :: start up to stop - 1
range(start, stop, step) :: step can be negative to count down
range(len(a)) :: the indexes of a list a
enumerate(seq) :: (index, item) pairs; enumerate(seq, start = 1) counts from 1
zip(a, b) :: loop over two sequences at once as pairs
reversed(seq) / sorted(seq) :: loop backwards / in sorted order
break :: leave the loop immediately
continue :: skip to the next round
for ... else: :: the else block runs if the loop was not ended by break
print(x, end = " ") :: print without a new line (end = "" prints nothing in between)
total += x :: accumulator pattern; count += 1 is a counter
for i in range(n): for j in range(i): :: nested loops, the inner loop restarts every round
sum(), len(), min(), max() :: shortcuts for common loops
result = ch + result :: building a text in reverse, one letter at a time
`,`
while cond: :: repeat as long as cond is True
while True: ... break :: loop until a break happens
break :: leave the loop
continue :: jump back to the condition check (update variables first!)
while ... else: :: else runs when the condition became False (not after break)
i += 1 / i -= 1 :: counter update; forgetting it gives an infinite loop
while stack: :: a non-empty list counts as True, so it loops until it is empty
stack.pop() :: remove and return the last item of a list, often used in while loops
x //= 10 and x % 10 :: remove / read the last digit of a number
a, b = b, a % b :: swap in one line (used for the greatest common divisor)
input() in a loop :: ask again until the input is valid
count, total = 0, 0 :: set up counters before the loop
while i < len(data) and data[i] != 0: :: stop at the end of the list or at a special value
`,`
try: ... :: code that may raise an error
except ValueError: :: runs if that error type occurs
except (A, B): :: one block for several error types
except Exception as e: :: catch (almost) any error and read its message through e
else: :: runs only if the try block had no error
finally: :: always runs, with or without an error (even after a return)
raise ValueError("msg") :: raise an error yourself
ValueError :: wrong value, e.g. int("abc")
ZeroDivisionError :: division or modulo by zero
TypeError :: wrong type, e.g. 1 + "a" or 10 // "a"
KeyError :: a dictionary key does not exist
IndexError :: list index out of range
FileNotFoundError :: the file does not exist
NameError :: a variable name is not defined
continue / break inside try :: skip an item / stop a loop when an error happens
int(text) :: raises ValueError when the text is not a whole number

function trDraw(id){const n=NBX[id],S=n.t,s=NBT[id],box=document.querySelector(`[data-nb="${id}"] .nbt`);if(!box||!s){trStop(id);return}

const G6=[[],[],[],[]];

const GL6=[
[/self\.__\w+/,"self.__name","is a private attribute: two leading underscores. Inside the class Python stores it as _ClassName__name, so it cannot be used directly from outside the class."],
[/def __(?!\w*__\()\w+\(/,"def __method(self)","is a private method: it can only be called inside the class, as self.__method()."],
[/\b_[A-Z]\w*__\w+/,"_Class__name","is the real (mangled) name of a private attribute or method. It still works from outside, because Python privacy is a convention."],
[/def (get|set)_\w+\(/,"getter / setter","a getter returns the value of a private attribute, a setter changes it after checking it (validation)."],
[/def __(lt|contains|call)__\(/,"__lt__ / __contains__ / __call__","are special methods: __lt__ for a < b (and for sorted), __contains__ for item in obj, __call__ to call the object like a function."],
[null,"sorted() with your own objects","uses your __lt__ method to compare the objects.",(c,l)=>/\bsorted\(/.test(c)&&/def __lt__/.test(c)],
[/\brepr\(/,"repr(obj)","gives the developer text of an object (its __repr__)."],
[null,"class inside a class","is an inner class. Create it through an outer object (outer.Inner()) or through the class name (Outer.Inner()). It does not see the outer object unless you pass it in.",(c,l)=>/^class \w+[^\n]*:\n(?:[ ]+\S[^\n]*\n|\n)*?[ ]+class \w+/m.test(c)],
[/self\.[A-Z]\w*\(/,"self.Inner()","creates an object of an inner class from inside a method of the outer class."],
[null,"self.part = Part(...)","is composition: the object creates and owns another object (has-a). Its methods can pass the work on, e.g. self.part.method().",(c,l)=>/self\.\w+ = [A-Z]\w*\(/.test(c)],
[/\bdel\s+\w+(\.\w+)?\s*$/m,"del name / del obj.attr / del Class.method","removes a variable, an attribute or a method. After del obj the name no longer exists (NameError). After del Class.method every object of the class loses that method."],
[/\b(AttributeError|NameError)\b/,"AttributeError / NameError","AttributeError: the object has no such attribute or method (also for private names used outside the class). NameError: the name does not exist, for example after del."]
];

function draw(cv,code){const av=(cv.parentElement&&cv.parentElement.clientWidth)||0;let fs=15;if(av){const c0=cv.getContext("2d");c0.font="15px ui-monospace,Menlo,Consolas,monospace";const w0=Math.max(...code.split("\n").map(l=>l.length))*c0.measureText("M").width+32;if(w0>av)fs=Math.max(11,Math.floor(15*av/w0*10)/10)}const f=fs+'px ui-monospace,Menlo,Consolas,monospace',lh=Math.round(fs*1.53),pad=16,d=window.devicePixelRatio||1,Ls=code.split("\n"),c=cv.getContext("2d");c.font=f;

    while((m=KW.exec(l))){if(m.index>pos)put(l.slice(pos,m.index),"#1f2937");put(m[0],m[1]?"#6b8e8e":m[2]?"#b22222":m[3]?"#007a00":m[4]?"#0057b8":"#9333ea",!!m[3]);pos=KW.lastIndex}
