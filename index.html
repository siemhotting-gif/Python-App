","[20, 40] [40, 50, 60] [60, 40, 20]",["[20, 40, 60] [40, 50, 60] [60, 40, 20]","[20, 40] [50, 60] [60, 40, 20]","[20, 40] [40, 50, 60] [60, 50, 40]"],"a[1:5:2] takes indexes 1 and 3. a[-3:] is the last three items. a[::-2] goes backwards in steps of 2: 60, 40, 20."],[3,6,"words = [\"kiwi\", \"fig\", \"banana\", \"plum\"]\nlengths = [len(w) for w in words if len(w) != 4]\nprint(lengths, max(lengths) - min(lengths))","[3, 6] 3",["[4, 3, 6, 4] 3","[3, 6] 6","[3, 6] 9"],"\"kiwi\" and \"plum\" have length 4 and are filtered out. The lengths of \"fig\" and \"banana\" are 3 and 6, and 6 - 3 = 3."],[3,6,"a = [4, 7, 1, 9]\na.insert(2, 5)\na.pop(0)\na.extend([3, 3])\nprint(a, a.count(3), a.index(9))","[7, 5, 1, 9, 3, 3] 2 3",["[7, 5, 1, 9, 3, 3] 2 4","[4, 7, 5, 1, 9, 3, 3] 2 4","[7, 1, 9, 3, 3] 2 2"],"insert(2, 5) gives [4, 7, 5, 1, 9]. pop(0) removes the 4. extend adds 3, 3. Then count(3) is 2 and 9 sits at index 3."],[3,7,"stock = {\"apple\": 4, \"pear\": 0, \"fig\": 7}\nstock[\"pear\"] += 5\nstock[\"kiwi\"] = stock.get(\"kiwi\", 0) + 2\ndel stock[\"fig\"]\nprint(stock, len(stock))","{'apple': 4, 'pear': 5, 'kiwi': 2} 3",["{'apple': 4, 'pear': 5, 'fig': 7, 'kiwi': 2} 4","{'apple': 4, 'pear': 0, 'kiwi': 2} 3","{'apple': 4, 'pear': 5, 'kiwi': 2} 4"],"pear becomes 5, kiwi is created with 0 + 2 = 2 (get gives the default 0), and fig is deleted. Three keys are left."],[3,7,"scores = {\"amy\": 8, \"bob\": 5, \"cy\": 9}\nbest = max(scores, key=scores.get)\ntotal = sum(v for v in scores.values() if v > 5)\nprint(best, total)","cy 17",["9 17","cy 22","amy 17"],"max(scores, key = scores.get) returns the key with the largest value: cy. Only the values above 5 are added: 8 + 9 = 17."],[3,7,"d = {\"x\": 1, \"y\": 2}\ne = {k: v * 10 for k, v in d.items()}\nd[\"x\"] = 100\nprint(e[\"x\"], d[\"x\"], list(e))","10 100 ['x', 'y']",["100 100 ['x', 'y']","10 100 [10, 20]","1 100 ['x', 'y']"],"The comprehension builds a new dictionary e = {'x': 10, 'y': 20}. Changing d afterwards does not affect e. list(e) gives its keys."],[3,7,"words = [\"to\", \"be\", \"or\", \"not\", \"to\", \"be\"]\nfreq = {}\nfor w in words:\n    freq[w] = freq.get(w, 0) + 1\nprint(freq, len(freq))","{'to': 2, 'be': 2, 'or': 1, 'not': 1} 4",["{'to': 1, 'be': 1, 'or': 1, 'not': 1} 4","{'to': 2, 'be': 2, 'or': 1, 'not': 1} 6","{'be': 2, 'to': 2, 'not': 1, 'or': 1} 4"],"get(w, 0) + 1 counts every word. Keys keep the order in which they first appeared: to, be, or, not. There are 4 different words."],[3,8,"a = {1, 2, 3, 4}\nb = {3, 4, 5}\nprint(sorted(a & b), sorted(a ^ b), len(a | b))","[3, 4] [1, 2, 5] 5",["[3, 4] [1, 2, 5] 7","[1, 2] [3, 4] 5","[3, 4] [1, 2, 3, 4, 5] 5"],"a & b is the overlap {3, 4}. a ^ b holds the items in exactly one set: {1, 2, 5}. a | b is the union {1, 2, 3, 4, 5}, which has 5 items."],[3,8,"t = (4, 8, 15, 16, 23)\nfirst, *middle, last = t\nprint(first + last, len(middle), middle)","27 3 [8, 15, 16]",["27 3 (8, 15, 16)","27 5 [8, 15, 16]","19 3 [8, 15, 16]"],"first = 4 and last = 23, so first + last = 27. The star collects the other three values in a list: [8, 15, 16]."],[3,8,"a = [3, 1, 3, 2, 1]\ns = set(a)\ns.add(2)\ns.discard(7)\ns.remove(3)\nprint(len(a), len(s), 3 in s)","5 2 False",["5 3 False","3 2 False","5 2 True"],"The list keeps its 5 items. set(a) is {1, 2, 3}; adding 2 changes nothing, discard(7) does nothing, and remove(3) leaves {1, 2}. So len(s) is 2 and 3 in s is False."],[3,8,"p = (2, 5)\nq = (1, 5, 2)\nr = p + q\nprint(r, r.count(5), r.index(2), len(set(r)))","(2, 5, 1, 5, 2) 2 0 3",["(2, 5, 1, 5, 2) 2 4 3","(2, 5, 1, 5, 2) 2 0 5","(3, 10, 2) 2 0 3"],"+ joins the tuples: (2, 5, 1, 5, 2). 5 occurs twice and the first 2 sits at index 0. The set {1, 2, 5} has 3 different values."],[4,9,"def combine(a, b=2, *rest):\n    return a * b + sum(rest)\n\nprint(combine(3), combine(3, 4), combine(3, 4, 5, 6))","6 12 23",["6 12 12","6 7 23","9 12 23"],"combine(3) uses b = 2: 3 * 2 + 0 = 6. combine(3, 4) = 12. In the last call rest = (5, 6), so 3 * 4 + 11 = 23."],[4,9,"def make_counter(start):\n    count = start\n    def step(k):\n        nonlocal count\n        count += k\n        return count\n    return step\n\nc = make_counter(10)\nprint(c(2), c(5), c(1))","12 17 18",["12 7 1","12 12 12","10 15 16"],"count lives on between the calls because step is a closure and nonlocal lets it change count: 10 + 2 = 12, then 17, then 18."],[4,9,"data = [5, 2, 9, 4]\nresult = list(map(lambda x: x * 2, filter(lambda x: x > 3, data)))\nprint(result, sorted(data, key=lambda x: -x)[0])","[10, 18, 8] 9",["[10, 4, 18, 8] 9","[10, 18, 8] 2","[10, 18, 8] 5"],"filter keeps 5, 9 and 4. map doubles them: [10, 18, 8]. Sorting with key = -x puts the largest first, so [0] is 9."],[4,10,"x = 5\ndef f():\n    x = 10\n    def g():\n        return x + 1\n    return g() + x\n\nprint(f(), x)","21 5",["16 5","21 10","15 5"],"g reads x from the enclosing function f (10), so g() = 11 and f() = 11 + 10 = 21. The global x is never changed and stays 5."],[4,10,"def total(n):\n    if n <= 0:\n        return 0\n    return n + total(n - 2)\n\nprint(total(6), total(5))","12 9",["12 15","21 15","6 9"],"total(6) = 6 + 4 + 2 + 0 = 12. total(5) = 5 + 3 + 1 + 0 = 9, because n goes 5, 3, 1, -1 and the base case n <= 0 stops it."],[4,10,"def pairs(n):\n    for i in range(n):\n        yield i, i * i\n\ng = pairs(4)\nnext(g)\na, b = next(g)\nrest = list(g)\nprint(a, b, rest)","1 1 [(2, 4), (3, 9)]",["0 0 [(1, 1), (2, 4), (3, 9)]","1 1 [(1, 1), (2, 4), (3, 9)]","1 1 [2, 3]"],"The first next(g) gives (0, 0) and is thrown away. The second gives (1, 1), so a = 1 and b = 1. list(g) collects what is left: (2, 4) and (3, 9)."],[4,10,"def show(n):\n    if n > 0:\n        show(n - 1)\n        print(n, end=\" \")\n\nshow(3)","1 2 3",["3 2 1","0 1 2 3","3 1 2"],"The recursive call comes before the print, so show(3) first waits for show(2), which waits for show(1). The prints happen on the way out: 1, then 2, then 3."],[4,10,"def f(n):\n    if n < 2:\n        return 1\n    return f(n - 1) + f(n - 2)\n\nprint(f(4))","5",["3","8","4"],"f(0) = f(1) = 1. So f(2) = 2, f(3) = 3 and f(4) = f(3) + f(2) = 5."],[4,11,"with open(\"scores.txt\", \"w\") as f:\n    for n in [4, 9, 6]:\n        f.write(str(n) + \"\\n\")\n\ntotal = 0\nwith open(\"scores.txt\") as f:\n    first = f.readline()\n    for line in f:\n        total += int(line)\nprint(first.strip(), total)","4 15",["4 19","9 15","4 10"],"The file holds the lines 4, 9 and 6. readline() reads the first line (4) and the loop then reads the remaining lines 9 and 6: 9 + 6 = 15."]];

[/\bself\.\w+\s*([-+*]?=)/,"self.attr = value","creates or changes an attribute of this object (an instance attribute). Every object has its own copy."],
[null,"class attribute","is a variable written directly in the class body. It is shared by all objects; Name.attr reads or changes it for everyone.",(c,l)=>/^class \w+[^\n]*:\n(?:[ ]{4}\w+ = [^\n]*\n)+/m.test(c)],
[null,"obj.method()","calls a method of that object; Python passes the object as self automatically.",(c,l)=>/^class /m.test(c)&&/\b[a-z_]\w*(\(\))?\.[a-z_]\w*\(/.test(c.replace(/^\s*def .*$/gm,""))],
[/class \w+\s*\(\s*\w+\s*\)/,"class Child(Parent):","inherits all attributes and methods of Parent. The child can add new ones or override existing ones."],
[/\bsuper\(\)/,"super()","gives access to the parent class: super().__init__(...) runs the parent's __init__ and super().method() the parent's version of a method."],
[/@classmethod/,"@classmethod","makes a method that gets the class (cls) instead of an object. Often used to create objects in another way: cls(...)."],
[/@staticmethod/,"@staticmethod","makes a plain function inside a class: it gets neither self nor cls."],
[/\bcls\b/,"cls","is the class itself inside a class method: cls.attr changes a class attribute and cls(...) creates an object."],
[/\bisinstance\(/,"isinstance(obj, Class)","is True when obj was made from Class or from a subclass of it."],
[/\bissubclass\(/,"issubclass(A, B)","is True when A is B or inherits from B."],
[/def __(str|repr|add|eq|len)__\(/,"__str__, __add__, __eq__ ...","are special methods: Python calls them for print(obj), obj + other, obj == other and so on, so your own objects work with normal syntax."],
[/\b(hasattr|getattr|setattr)\(/,"hasattr / getattr / setattr","check, read or set an attribute by its name (a string)."],
[/\.__dict__|\bvars\(/,"obj.__dict__","is a dictionary with the instance attributes of the object."],
[/\.__mro__/,"Class.__mro__","is the order in which Python searches the classes for a method: the class itself first, then its parents."],
[/\.__name__/,"__name__","is the name of a class or function as a string."],
[/\bpass\b/,"pass","does nothing; it fills an empty block, for example an empty class."]

const OOPLES=[["A class is a blueprint; an object (instance) is one thing made from that blueprint. __init__ runs automatically when an object is created, and self is the object that the method is working on.",[["class Dog:\n    pass\n\nd = Dog()\nprint(type(d).__name__, isinstance(d, Dog))   # Dog True","class defines a new type. Dog() creates an object (an instance) of that class."],["class Rect:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n\n    def area(self):\n        return self.w * self.h\n\nr = Rect(3, 4)\nprint(r.w, r.h, r.area())   # 3 4 12","Rect(3, 4) creates the object and runs __init__ for you. self is the new object, so self.w = w stores a value on it (an attribute). Every method gets the object as its first parameter, which is why area() can use self.w and self.h. Press 👣 to follow it."],["big = Rect(10, 20)\nr.w = 5\nprint(r.area(), big.area())   # 20 200\nprint(r is big, r.w == big.w)   # False False","Every object has its own attributes. Changing r does not change big."],["class Item:\n    def __init__(self, name, qty=1):\n        self.name = name\n        self.qty = qty\n\n    def __str__(self):\n        return f\"{self.qty} x {self.name}\"\n\nprint(Item(\"pen\"))   # 1 x pen\nprint(Item(\"cup\", 3))   # 3 x cup","__init__ can have default values like any function. __str__ decides what print(obj) shows."],["a = Item(\"pen\")\nb = a\nb.qty = 10\nprint(a.qty)   # 10\nc = Item(\"pen\")\nprint(c.qty, a is c)   # 1 False","b = a does not copy the object: both names point to the same object. Item(...) always makes a new one."]],["self is the first parameter of every method, but you do not pass it yourself: Rect(3, 4) fills in self automatically.","Forgetting self. in self.w = w: then w is only a local variable and the object gets no attribute.","b = a gives a second name for the same object, not a copy.","__init__ must not return a value."]],["Attributes can belong to the class (shared by all objects) or to one object. Python looks on the object first and then on its class.",[["class Dog:\n    species = \"dog\"      # class attribute\n    count = 0\n\n    def __init__(self, name):\n        self.name = name      # instance attribute\n        Dog.count += 1\n\na = Dog(\"Rex\")\nb = Dog(\"Fido\")\nprint(a.name, b.name, a.species, Dog.count)   # Rex Fido dog 2","species and count are written in the class body, so they belong to the class. self.name belongs to one object. Every new Dog adds 1 to Dog.count. Press 👣 to follow it."],["print(a.count, b.count)   # 2 2\na.species = \"wolf\"\nprint(a.species, b.species, Dog.species)   # wolf dog dog","Reading a.count finds the class attribute. Setting a.species creates a new instance attribute that hides the class attribute for a only."],["Dog.species = \"canine\"\nprint(a.species, b.species)   # wolf canine","Changing the class attribute changes it for every object that has no value of its own."],["class Bad:\n    items = []\n\nx = Bad()\ny = Bad()\nx.items.append(1)\nprint(y.items)   # [1]","A mutable class attribute (a list) is shared by all objects. Create the list in __init__ (self.items = []) to give every object its own."],["print(a.__dict__)   # {'name': 'Rex', 'species': 'wolf'}\nprint(hasattr(a, \"name\"), hasattr(a, \"age\"))   # True False\na.age = 3\nprint(getattr(a, \"age\"), hasattr(a, \"age\"))   # 3 True","__dict__ shows the instance attributes. hasattr, getattr and setattr work with attribute names. Objects can get new attributes at any time."]],["self.count += 1 would create an instance attribute instead of changing the class attribute: use Dog.count += 1.","Mutable class attributes (lists, dictionaries) are shared by every object.","Assigning on an object never changes the class attribute; it only hides it for that object."]],["Methods are functions inside a class. Instance methods work on one object through self; class methods get the class (cls); static methods get neither.",[["class Counter:\n    def __init__(self):\n        self.n = 0\n\n    def add(self, k=1):\n        self.n += k\n        return self\n\n    def show(self):\n        print(\"n =\", self.n)\n\nc = Counter()\nc.add()\nc.add(5).add(2)\nc.show()   # n = 8","add returns self, so calls can be chained: c.add(5).add(2). Press 👣 to see the same object being changed again and again."],["Counter.show(c)   # n = 8\nprint(Counter.add(c, 2).n)   # 10","c.show() is a short form of Counter.show(c): Python passes the object as self for you."],["class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    @classmethod\n    def from_text(cls, text):\n        name, age = text.split(\"-\")\n        return cls(name, int(age))\n\np = Person.from_text(\"Ana-30\")\nprint(p.name, p.age)   # Ana 30","A class method gets the class as cls. It is often used as an alternative way to create objects: cls(...) builds a Person."],["class Maths:\n    @staticmethod\n    def add(x, y):\n        return x + y\n\nprint(Maths.add(2, 3), Maths().add(4, 5))   # 5 9","A static method is a plain function that lives in the class. It has no self and no cls."],["class Ticket:\n    sold = 0\n\n    @classmethod\n    def sell(cls):\n        cls.sold += 1\n        return cls.sold\n\nTicket.sell()\nprint(Ticket.sell(), Ticket.sold)   # 2 2","Class methods can change class attributes through cls."],["class Pt:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __str__(self):\n        return f\"({self.x}, {self.y})\"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\nprint(Pt(1, 2), Pt(1, 2) == Pt(1, 2), Pt(1, 2) is Pt(1, 2))   # (1, 2) True False","Special methods with double underscores let your objects work with print, == and other operators."]],["Every instance method needs self as its first parameter.","A method that changes the object and has no return gives None, so obj.add(1).add(2) only works when add returns self.","@classmethod gets cls, @staticmethod gets nothing extra."]],["A child class inherits everything from its parent class and can add or replace (override) methods.",[["class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n    def intro(self):\n        return f\"{self.name} says {self.speak()}\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\na = Animal(\"Generic\")\nd = Dog(\"Rex\")\nprint(a.intro())   # Generic says ...\nprint(d.intro())   # Rex says Woof","Dog inherits __init__ and intro from Animal and overrides speak. intro() runs the parent's code, but self.speak() finds the Dog version first. Press 👣 to follow the lookup."],["class Puppy(Dog):\n    def __init__(self, name, age):\n        super().__init__(name)\n        self.age = age\n\n    def speak(self):\n        return super().speak() + \"!\"\n\np = Puppy(\"Bit\", 1)\nprint(p.name, p.age, p.speak())   # Bit 1 Woof!","super() reaches the parent class. super().__init__(name) sets the attributes of the parent; super().speak() reuses the parent's version of a method. Press 👣 to follow it."],["print(isinstance(p, Puppy), isinstance(p, Dog), isinstance(p, Animal))   # True True True\nprint(issubclass(Dog, Animal), issubclass(Animal, Dog))   # True False\nprint([c.__name__ for c in Puppy.__mro__])   # ['Puppy', 'Dog', 'Animal', 'object']","isinstance is True for the class of the object and all its parents. __mro__ is the order in which Python searches for a method."],["class Base:\n    limit = 5\n\n    def check(self, v):\n        return v <= self.limit\n\nclass Child(Base):\n    limit = 10\n\nprint(Base().check(7), Child().check(7))   # False True","Attributes can be overridden too. check() is inherited, but self.limit is looked up on the real object."],["class Cat(Animal):\n    pass\n\nc = Cat(\"Tom\")\nprint(c.speak(), c.intro())   # ... Tom says ...","A child with pass behaves exactly like its parent."]],["If a child defines __init__, call super().__init__(...) or the attributes of the parent are never created.","Python searches the object's class first, then the parent, then the grandparent.","Inheritance means 'is a': a Dog is an Animal."]],["Polymorphism means that the same method name or operator can do different things for different objects. The code that calls it does not need to know the class.",[["class Dog:\n    def speak(self):\n        return \"Woof\"\n\nclass Cat:\n    def speak(self):\n        return \"Meow\"\n\nfor pet in [Dog(), Cat(), Dog()]:\n    print(pet.speak())","One loop, one method name, different results. Press 👣 to see which class runs in every round."],["class Shape:\n    def area(self):\n        return 0\n\nclass Square(Shape):\n    def __init__(self, s):\n        self.s = s\n\n    def area(self):\n        return self.s ** 2\n\nclass Rect(Shape):\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n\n    def area(self):\n        return self.w * self.h\n\nshapes = [Square(3), Rect(2, 5), Shape()]\nprint([s.area() for s in shapes], sum(s.area() for s in shapes))   # [9, 10, 0] 19","A parent class can give a default (Shape.area is 0) and each child overrides it. The list comprehension calls the right version for every object."],["print(len(\"abc\"), len([1, 2]), len({\"a\": 1}))   # 3 2 1\nprint(1 + 2, \"a\" + \"b\", [1] + [2])   # 3 ab [1, 2]\nprint(2 * 3, 2 * \"ab\", 2 * [0])   # 6 abab [0, 0]","Python itself is polymorphic: len, + and * work on different types and do the right thing for each."],["class Vec:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n        return Vec(self.x + other.x, self.y + other.y)\n\n    def __str__(self):\n        return f\"Vec({self.x}, {self.y})\"\n\nprint(Vec(1, 2) + Vec(3, 4))   # Vec(4, 6)","Defining __add__ lets + work for your own objects (operator overloading)."],["class Duck:\n    def quack(self):\n        return \"Quack\"\n\nclass Robot:\n    def quack(self):\n        return \"Beep\"\n\ndef make_it_quack(thing):\n    return thing.quack()\n\nprint(make_it_quack(Duck()), make_it_quack(Robot()))   # Quack Beep","Duck typing: the function works with any object that has a quack method. The classes do not need a common parent."]],["Polymorphism needs the same method name in every class; otherwise Python raises an AttributeError.","Python has no overloading by parameters: a second def with the same name replaces the first. Use default arguments instead.","A common parent class is not required in Python (duck typing)."]]];const OOPREF=["class Name: :: define a new class (a blueprint); the body is indented\nobj = Name(args) :: create an object (instance); Python calls __init__ for you\ndef __init__(self, a, b): :: runs when an object is created; sets the starting attributes\nself :: the object the method works on; always the first parameter of a method\nself.attr = value :: create or change an attribute of this object\nobj.attr :: read an attribute of an object\nobj.method(args) :: call a method; Python passes obj as self automatically\nName.method(obj, args) :: the same call written through the class\ndef __init__(self, a, b = 0): :: default values work like in any function\ndef __str__(self): :: the text used by print(obj) and str(obj); it must return a string\ndef __repr__(self): :: developer text shown in the console and inside lists\ndef __eq__(self, other): :: what == does for your own objects\nb = a :: no copy: both names point to the same object\na is b / a == b :: same object / equal values (== needs __eq__ for your own classes)\ntype(obj) / type(obj).__name__ :: the class of an object / its name\nisinstance(obj, Name) :: True if obj was made from Name (or from a subclass)\npass :: empty body, for example for an empty class","class Name: attr = 5 :: class attribute: one value shared by the whole class\nself.attr = value (in __init__) :: instance attribute: every object has its own\nName.attr / obj.attr :: read the class attribute; an object finds it too when it has no own value\nobj.attr = value :: creates an instance attribute that hides the class attribute for this object only\nName.attr = value :: changes the class attribute for every object without an own value\nName.count += 1 :: change a class attribute from inside a method (self.count += 1 would create an instance attribute)\nitems = [] (class level) :: a mutable class attribute is shared by all objects, usually a bug\nself.items = [] (in __init__) :: every object gets its own list\nhasattr(obj, \"name\") :: True if the attribute exists\ngetattr(obj, \"name\", default) :: read an attribute by its name (default if missing)\nsetattr(obj, \"name\", v) :: set an attribute by its name\ndel obj.attr :: remove an instance attribute\nobj.__dict__ :: dictionary with the instance attributes of obj\nvars(obj) :: the same as obj.__dict__","def method(self, a): :: instance method: works on one object through self\nself.method(a) :: call another method of the same object\nreturn self :: lets you chain calls: obj.add(1).add(2)\n@classmethod :: method that gets the class (cls) instead of an object\ndef create(cls, ...): :: first parameter is cls; use cls(...) to build an object\nName.create(...) :: call a class method on the class\n@staticmethod :: plain function inside a class: no self and no cls\nName.helper(a, b) :: call a static method (it also works on an object)\ncls.attr += 1 :: change a class attribute from a class method\nName.method(obj) :: calling an instance method through the class: you pass the object yourself\n__str__ / __repr__ :: text for print() and for the console\n__eq__(self, other) :: what == does for your objects\n__len__(self) :: what len(obj) returns\n__add__(self, other) :: what obj + other does","class Child(Parent): :: Child inherits all attributes and methods of Parent\ndef method(self): ... (in Child) :: override: the version of Child is used for Child objects\nsuper().method() :: call the parent's version of a method\nsuper().__init__(args) :: run the parent's __init__ so its attributes are created\nclass Child(Parent): pass :: a child that behaves exactly like its parent\nisinstance(obj, Class) :: True for the class of obj and for all its parents\nissubclass(A, B) :: True if A is B or inherits from B\nClass.__mro__ :: the order in which Python searches the classes for a method\nClass.__name__ :: the name of the class as text\nclass C(A, B): :: multiple inheritance (A is searched before B)\nchild with its own __init__ :: must call super().__init__() or the parent's attributes are not created\nlookup order :: the object, then its class, then the parent, then the grandparent\nclass attribute in Child :: replaces the parent's value for Child objects only\nobj.__class__ :: the class of obj (same as type(obj))","same method name in different classes :: polymorphism: obj.speak() does what the class of that object says\nfor item in items: item.method() :: one loop works for objects of different classes\noverride in child classes :: the parent gives a default and the children change it\nduck typing :: if the object has the method you call, it works; no common parent is needed\nAttributeError :: raised when an object has no such attribute or method\nlen(x), x + y, x * 2 :: built-in polymorphism: the same function or operator works on different types\ndef __add__(self, other): :: make + work for your own objects\ndef __str__(self): :: print() works on every object, each class decides the text\ndef __len__(self): :: make len(obj) work\nsum(o.area() for o in shapes) :: use the results of different implementations together\nhasattr(obj, \"method\") :: check before calling when you are not sure\nisinstance(x, (A, B)) :: test for one of several classes\nsuper().method() :: reuse the behaviour of the parent inside an override\nno overloading in Python :: a second def with the same name replaces the first; use default arguments instead"];const OOPOPEN=[[12,"Create a class Rectangle with a width and a height (set in __init__) and the methods area() and perimeter(). Create one object and print both values.","class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    def area(self):\n        return self.width * self.height\n\n    def perimeter(self):\n        return 2 * (self.width + self.height)\n\nr = Rectangle(3, 4)\nprint(r.area(), r.perimeter())"],[12,"Write a class Student with a name and a list of grades. Add the methods add_grade(g) and average(). Create a student, add three grades and print the average.","class Student:\n    def __init__(self, name):\n        self.name = name\n        self.grades = []\n\n    def add_grade(self, g):\n        self.grades.append(g)\n\n    def average(self):\n        return sum(self.grades) / len(self.grades)\n\ns = Student(\"Ana\")\ns.add_grade(7)\ns.add_grade(9)\ns.add_grade(8)\nprint(s.average())"],[12,"Add a __str__ method to a class Book (title, pages) so that print(book) shows for example: Python (300 pages).","class Book:\n    def __init__(self, title, pages):\n        self.title = title\n        self.pages = pages\n\n    def __str__(self):\n        return f\"{self.title} ({self.pages} pages)\"\n\nprint(Book(\"Python\", 300))"],[13,"Make a class Car with a class attribute wheels = 4 and a class attribute count that counts how many cars were created. Create three cars and print Car.count.","class Car:\n    wheels = 4\n    count = 0\n\n    def __init__(self):\n        Car.count += 1\n\nCar()\nCar()\nCar()\nprint(Car.count, Car.wheels)"],[13,"Show that setting an attribute on an object hides the class attribute: make a class Dog with species = \"dog\", change it on one object and print the value for that object, for another object and for the class.","class Dog:\n    species = \"dog\"\n\na = Dog()\nb = Dog()\na.species = \"wolf\"\nprint(a.species, b.species, Dog.species)"],[14,"Write a class BankAccount with the methods deposit(amount) and withdraw(amount). withdraw should print \"Not enough money\" when the balance is too low. Test both methods.","class BankAccount:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            print(\"Not enough money\")\n        else:\n            self.balance -= amount\n\nacc = BankAccount(50)\nacc.deposit(25)\nacc.withdraw(100)\nacc.withdraw(30)\nprint(acc.balance)"],[14,"Add a @classmethod from_string(cls, text) to a class Person (name, age) that builds a Person from the text \"Ana-30\".","class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    @classmethod\n    def from_string(cls, text):\n        name, age = text.split(\"-\")\n        return cls(name, int(age))\n\np = Person.from_string(\"Ana-30\")\nprint(p.name, p.age)"],[14,"Write a class with a @staticmethod is_even(n) and use it without creating an object.","class Numbers:\n    @staticmethod\n    def is_even(n):\n        return n % 2 == 0\n\nprint(Numbers.is_even(4), Numbers.is_even(7))"],[15,"Create a class Animal with a name and a method speak() that returns \"...\". Make the subclasses Dog and Cat that override speak(). Print what each of them says.","class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"\n\nfor a in [Animal(\"x\"), Dog(\"Rex\"), Cat(\"Tom\")]:\n    print(a.name, a.speak())"],[15,"Make a class Vehicle with __init__(self, brand). Make a class Car(Vehicle) with an extra attribute doors. Use super().__init__ and print both attributes.","class Vehicle:\n    def __init__(self, brand):\n        self.brand = brand\n\nclass Car(Vehicle):\n    def __init__(self, brand, doors):\n        super().__init__(brand)\n        self.doors = doors\n\nc = Car(\"Volvo\", 5)\nprint(c.brand, c.doors)"],[16,"Make the classes Circle and Square that both have an area() method. Put objects of both classes in a list and print the total area.","class Circle:\n    def __init__(self, r):\n        self.r = r\n\n    def area(self):\n        return 3.14 * self.r ** 2\n\nclass Square:\n    def __init__(self, s):\n        self.s = s\n\n    def area(self):\n        return self.s ** 2\n\nshapes = [Circle(1), Square(2), Circle(2)]\nprint(sum(s.area() for s in shapes))"],[16,"Add __add__ to a class Money(amount) so that Money(5) + Money(7) gives a Money object with amount 12.","class Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __add__(self, other):\n        return Money(self.amount + other.amount)\n\ntotal = Money(5) + Money(7)\nprint(total.amount)"],[16,"Write a function describe(thing) that calls thing.describe(), and use it with two different classes that both have a describe() method.","class Cat:\n    def describe(self):\n        return \"a small cat\"\n\nclass Car:\n    def describe(self):\n        return \"a red car\"\n\ndef describe(thing):\n    return thing.describe()\n\nprint(describe(Cat()), describe(Car()))"]];const OOPEXAM=[[5,12,"class Box:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n\n    def area(self):\n        return self.w * self.h\n\na = Box(3, 4)\nb = a\nb.w = 5\nprint(a.area(), Box(2, 2).area())","20 4",["12 4","20 20","12 20"],"b = a is the same object, so b.w = 5 also changes a: 5 * 4 = 20. Box(2, 2) is a new object with area 4."],[5,13,"class Ticket:\n    sold = 0\n\n    def __init__(self):\n        Ticket.sold += 1\n        self.number = Ticket.sold\n\na = Ticket()\nb = Ticket()\nc = Ticket()\nprint(a.number, c.number, Ticket.sold)","1 3 3",["3 3 3","1 1 3","1 3 1"],"sold is shared by the class. Each new Ticket increases it and stores the new value in its own number: 1, 2, 3. After three tickets sold is 3."],[5,13,"class )\n\ntotal = Money(5) + Money(7) + Money(1)\nprint(total, total.v)","$13 13",["$13 $13","13 13","$7 13"],"+ calls __add__ twice and gives a Money object with v = 13. print(total) uses __str__ and shows $13; total.v is the plain number 13."],[5,14,"class Stack:\n    def __init__(self):\n        self.items = []\n\n    def push(self, x):\n        self.items.append(x)\n        return self\n\n    def pop(self):\n        return self.items.pop()\n\ns = Stack().push(1).push(2).push(3)\nprint(s.pop(), s.pop(), len(s.items))","3 2 1",["1 2 1","3 2 0","3 2 3"],"push returns self, so the calls can be chained and the list becomes [1, 2, 3]. pop() takes the last item twice (3, then 2), which leaves 1 item."],[5,13,"class Team:\n    members = []\n\n    def add(self, n):\n        self.members.append(n)\n\na = Team()\nb = Team()\na.add(\"x\")\nb.add(\"y\")\nprint(len(a.members), len(b.members), a.members is b.members)","2 2 True",["1 1 False","2 1 True","1 1 True"],"members is a class attribute, so a and b share one list. Both adds go into it, so both lengths are 2 and it is the same list object."]];const OOPNBX={"12.0":{"o":"Dog True"},"12.1":{"o":"3 4 12","c":"class Rect:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n\n    def area(self):\n        return self.w * self.h\n\nr = Rect(3, 4)\nprint(r.w, r.h, r.area())   # 3 4 12","t":[[0,1,"",[],0,"Defines the class Rect: Python runs the class body once and stores the class under this name."],[1,1,"class Rect",[],0,"Python runs the class body once, from top to bottom, to collect the attributes and methods of the class."],[0,2,"class Rect",[],0,"Defines the method __init__. Its body only runs when the method is called."],[0,6,"class Rect",[],0,"Defines the method area. Its body only runs when the method is called."],[2,6,"class Rect",[],0,"The class body is finished: the class Rect now exists."],[0,9,"",[],0,"Creates a new Rect object. Python calls Rect.__init__ with the new object as self, then stores the obj const GL6=[
[/self\.__\w+/,"self.__name","is a private attribute: two leading underscores. Inside the class Python stores it as _ClassName__name, so it cannot be used directly from outside the class."],
[/def __(?!\w*__\()\w+\(/,"def __method(self)","is a private method: it can only be called inside the class, as self.__method()."],
[/\b_[A-Z]\w*__\w+/,"_Class__name","is the real (mangled) name of a private attribute or method. It still works from outside, because Python privacy is a convention."],
[/def (get|set)_\w+\(/,"getter / setter","a getter returns the value of a private attribute, a setter changes it after checking it (validation)."],
[/def __(lt|contains|call)__\(/,"__lt__ / __contains__ / __call__","are special methods: __lt__ for a < b (and for sorted), __contains__ for item in obj, __call__ to call the object like a function."],
[null,"sorted() with your own objects","uses your __lt__ method to compare the objects.",(c,l)=>/\bsorted\(/.test(c)&&/def __lt__/.test(c)],
[/\brepr\(/,"repr(obj)","gives the developer text of an object (its __repr__)."],
[null,"class inside a class","is an inner class. Create it through an outer object (outer.Inner()) or through the class name (Outer.Inner()). It does not see the outer object unless you pass it in.",(c,l)=>/^class \w+[^\n]*:\n(?:[ ]+\S[^\n]*\n|\n)*?[ ]+class \w+/m.test(c)],
[/self\.[A-Z]\w*\(/,"self.Inner()","creates an object of an inner class from inside a method of the outer class."],
[null,"self.part = Part(...)","is composition: the object creates and owns another object (has-a). Its methods can pass the work on, e.g. self.part.method().",(c,l)=>/self\.\w+ = [A-Z]\w*\(/.test(c)],
[/\bdel\s+\w+(\.\w+)?\s*$/m,"del name / del obj.attr / del Class.method","removes a variable, an attribute or a method. After del obj the name no longer exists (NameError). After del Class.method every object of the class loses that method."],
[/\b(AttributeError|NameError)\b/,"AttributeError / NameError","AttributeError: the object has no such attribute or method (also for private names used outside the class). NameError: the name does not exist, for example after del."]
];
const OOP2LES={"les":[["Encapsulation puts data and the methods that use it together in one class and controls how the data can be read and changed. Private attributes and methods start with two underscores; getters and setters give controlled access, and a setter can validate the new value.",[["class Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n\n    def get_salary(self):\n        return self.salary\n\n    def set_salary(self, new_salary):\n        if new_salary > 0:\n            self.salary = new_salary\n        else:\n            print(\"Salary must be positive.\")\n\nemp = Employee(\"Peter\", 4500)\nemp.set_salary(5000)\nprint(emp.get_salary())   # 5000\nemp.set_salary(-5000)\nprint(emp.get_salary())   # 5000","A getter reads a value and a setter changes it. The setter checks the new value first, so the object never ends up with an invalid salary."],["class Employee:\n    def __init__(self, name, age):\n        self.name = name\n        self.__age = age        # private property\n\np1 = Employee(\"Peter\", 25)\nprint(p1.name)   # Peter\ntry:\n    print(p1.__age)\nexcept AttributeError:\n    print(\"AttributeError: no attribute __age\")","Two underscores make an attribute private: from outside the class p1.__age raises an AttributeError."],["class Employee:\n    def __init__(self, name, age):\n        self.name = name\n        self.__age = age\n\n    def get_age(self):\n        return self.__age\n\np1 = Employee(\"Peter\", 25)\np1.__age = 35          # creates a NEW attribute\nprint(p1.get_age(), p1.__age)   # 25 35\nprint(p1.__dict__)","Inside the class Python renames __age to _Employee__age (name mangling). Assigning p1.__age outside the class does not touch it: it creates a second, separate attribute. __dict__ shows both."],["class Student:\n    def __init__(self, name, grade):\n        self.name = name\n        self.__grade = grade\n\n    def __is_valid_grade(self, grade):\n        return 0 <= grade <= 10\n\n    def get_grade(self):\n        return self.__grade\n\n    def set_grade(self, new_grade):\n        if self.__is_valid_grade(new_grade):\n            self.__grade = new_grade\n            print(f\"Grade updated to {self.__grade}\")\n        else:\n            print(\"Invalid grade! Grade must be between 0 and 10.\")\n\ns = Student(\"Martijn\", 8.5)\ns.set_grade(9.0)\ns.set_grade(10.5)\nprint(s.get_grade())   # 9.0","A private method (also two underscores) can only be called inside the class, here by the setter to validate the grade. Press 👣 to follow the first call."],["try:\n    s.__is_valid_grade(5)\nexcept AttributeError:\n    print(\"private method: not available outside the class\")\nprint(s._Student__is_valid_grade(5))   # True","Private methods cannot be called directly from outside. But the mangled name still works: Python privacy is a convention and not strict like in Java."]],["Two underscores (__grade) mean private. One underscore (_grade) is only a convention: it is not private.","Setting obj.__x from outside creates a new attribute and does not change the private one.","Private does not mean unreachable: obj._ClassName__x still works, so use it only for understanding.","Always validate in the setter, never trust the value."]],["Magic (dunder) methods have names with double underscores on both sides. You do not call them yourself: Python calls them when you use print, ==, +, len, in, < and so on, so your own objects behave like built-in types.",[["class StudentRecord:\n    def __init__(self, name, scores):\n        self.name = name\n        self.scores = scores      # dictionary: subject -> mark\n\n    def total(self):\n        return sum(self.scores.values())\n\n    def __str__(self):\n        return f\"{self.name}, total {self.total()}\"\n\n    def __repr__(self):\n        return f\"StudentRecord(name={self.name!r})\"\n\n    def __eq__(self, other):\n        return self.name == other.name and self.scores == other.scores\n\n    def __add__(self, other):\n        return self.total() + other.total()\n\n    def __len__(self):\n        return len(self.scores)\n\n    def __lt__(self, other):\n        return self.total() < other.total()\n\n    def __contains__(self, subject):\n        return subject in self.scores\n\n    def __call__(self):\n        return self.total() / len(self.scores)\n\ns1 = StudentRecord(\"Peter\", {\"math\": 80, \"science\": 70, \"english\": 90})\ns2 = StudentRecord(\"Ben\", {\"math\": 75, \"science\": 85, \"english\": 80})\nprint(s1)   # Peter, total 240\nprint(repr(s1))   # StudentRecord(name='Peter')\nprint(s1 == s2, s1 + s2, len(s1))   # False 480 3\nprint(s1 < s2, \"math\" in s1, s1())   # False True 80.0","One method for each operation: __str__ for print, __repr__ for repr, __eq__ for ==, __add__ for +, __len__ for len, __lt__ for <, __contains__ for in and __call__ for obj()."],["class Pt:\n    def __init__(self, x):\n        self.x = x\n\n    def __str__(self):\n        return f\"Pt({self.x})\"\n\n    def __add__(self, other):\n        return Pt(self.x + other.x)\n\n    def __lt__(self, other):\n        return self.x < other.x\n\na = Pt(1)\nb = Pt(2)\nc = a + b\nprint(c, a < b)   # Pt(3) True","Press 👣 and watch Python call __add__, __str__ and __lt__ by itself: you never write c = a.__add__(b)."],["records = [StudentRecord(\"Peter\", {\"math\": 80}), StudentRecord(\"Ben\", {\"math\": 60}), StudentRecord(\"Sara\", {\"math\": 90})]\nprint([r.name for r in sorted(records)])   # ['Ben', 'Peter', 'Sara']\nprint(sorted(records, reverse=True)[0])   # Sara, total 90","sorted() compares the objects with __lt__, so a class with __lt__ can be sorted."],["a = StudentRecord(\"Ana\", {\"math\": 7})\nb = StudentRecord(\"Ana\", {\"math\": 7})\nprint(a == b, a is b)   # True False","== uses your __eq__ (equal content); is checks whether it is the very same object."],["print([s1, s2])   # [StudentRecord(name='Peter'), StudentRecord(name='Ben')]","Objects inside a list are shown with __repr__, not with __str__."]],["__str__ must return a string (not print it).","print(obj) uses __str__; the console and lists use __repr__.","Without __eq__ two objects are equal only when they are the same object.","Without __lt__ you cannot sort or compare objects with <."]],["An inner class is a class defined inside another class. It is useful when a class only makes sense in the context of the outer class.",[["class Outer:\n    def __init__(self):\n        self.name = \"Outer\"\n\n    class Inner:\n        def __init__(self):\n            self.name = \"Inner\"\n\n        def display(self):\n            print(\"Hello from the inner class\")\n\nouter1 = Outer()\ninner1 = outer1.Inner()\ninner1.display()\nprint(outer1.name, inner1.name)   # Outer Inner","Create the outer object first, then use it to create an inner object: outer1.Inner(). Each object has its own name."],["inner2 = Outer.Inner()\nprint(type(inner2).__name__, isinstance(inner2, Outer))   # Inner False","The inner class can also be reached through the class name. An inner object is not an instance of the outer class."],["class Outer:\n    def __init__(self, name, city):\n        self.name = name\n        self.city = city\n\n    class Inner:\n        def __init__(self, outer, company):\n            self.outer = outer\n            self.company = company\n\n        def display(self):\n            print(f\"{self.outer.name} from {self.outer.city} works at {self.company}\")\n\nouter1 = Outer(\"Peter\", \"Amsterdam\")\ninner1 = outer1.Inner(outer1, \"VU\")\ninner1.display()   # Peter from Amsterdam works at VU","An inner class does not automatically know the outer object. Pass it in (here as outer) and store it. Press 👣 to follow it."],["class Car:\n    def __init__(self, brand, model):\n        self.brand = brand\n        self.model = model\n        self.engine = self.Engine()\n\n    class Engine:\n        def __init__(self):\n            self.status = \"Off\"\n\n        def start(self):\n            self.status = \"Running\"\n            print(\"Engine started\")\n\n        def stop(self):\n            self.status = \"Off\"\n            print(\"Engine stopped\")\n\n    def drive(self):\n        if self.engine.status == \"Running\":\n            print(f\"Driving the {self.brand} {self.model}\")\n        else:\n            print(\"Start the engine first!\")\n\ncar = Car(\"Toyota\", \"Corolla\")\ncar.drive()\ncar.engine.start()\ncar.drive()\ncar.engine.stop()\ncar.drive()","A real-life example: the Car creates its own Engine with self.Engine() in __init__. It does not matter where in the class body the inner class is written. Press 👣 to follow the whole run."],["class Car2:\n    def __init__(self):\n        self.engine = self.Engine()\n\nclass Engine:\n    pass\n\ntry:\n    Car2()\nexcept AttributeError as e:\n    print(\"AttributeError:\", e)","Engine is written at the same indentation as Car2, so it is a normal class and not an inner class: self.Engine does not exist."]],["Write the inner class inside (indented in) the outer class, otherwise self.Engine() fails.","Reach an inner class through an outer object (outer.Inner()) or through the class name (Outer.Inner()).","The inner object only sees the outer object when you pass it in."]],["Composition means that one object contains another object: a has-a relationship. Small classes are combined to build bigger ones.",[["class Engine:\n    def __init__(self, fuel_type):\n        self.fuel_type = fuel_type\n\n    def start(self):\n        print(f\"The {self.fuel_type} engine has started.\")\n\nclass Car:\n    def __init__(self, brand, fuel_type):\n        self.brand = brand\n        self.engine = Engine(fuel_type)      # a Car HAS an Engine\n\n    def start_car(self):\n        print(f\"Starting the {self.brand}\")\n        self.engine.start()\n\ncar1 = Car(\"Toyota\", \"Petrol\")\ncar1.start_car()","The Car creates an Engine and keeps it in self.engine. start_car() hands the work over to the contained object: self.engine.start(). Press 👣 to follow it."],["class Course:\n    def __init__(self, name, grade):\n        self.name = name\n        self.grade = grade\n\n    def __str__(self):\n        return f\"{self.name} (Grade: {self.grade})\"\n\nclass Student:\n    def __init__(self, name, course):\n        self.name = name\n        self.course = course\n\n    def __str__(self):\n        return f\"Student: {self.name}, Course: {self.course}\"\n\ncourse1 = Course(\"Python Programming\", 8.5)\nstudent1 = Student(\"Peter\", course1)\nprint(student1)   # Student: Peter, Course: Python Programming (Grade: 8.5)\ncourse1.grade = 9\nprint(student1.course.grade)   # 9","The Course object is created outside and passed in. The Student only holds a reference, so a change to course1 is visible through student1.course. Inside the f-string, {self.course} uses the __str__ of Course."],["class Courses:\n    def __init__(self, year, semester, course):\n        self.year = year\n        self.semester = semester\n        self.course = course\n\n    def __str__(self):\n        return f\"{self.year}, Semester {self.semester}: {self.course}\"\n\nclass Student:\n    def __init__(self, name, country):\n        self.name = name\n        self.country = country\n        self.courses = []\n\n    def add_course(self, record):\n        self.courses.append(record)\n\n    def display(self):\n        print(f\"Student: {self.name}\")\n        print(f\"Country: {self.country}\")\n        for record in self.courses:\n            print(\"  \" + str(record))\n\npeter = Student(\"Peter\", \"Netherlands\")\npeter.add_course(Courses(2026, 1, Course(\"Python Programming\", 8)))\npeter.add_course(Courses(2026, 2, Course(\"Data Science\", 9)))\npeter.display()","Objects can be nested several levels: a Student has a list of Courses records and every record has a Course."],["class Vehicle:\n    def move(self):\n        return \"moving\"\n\nclass Bike(Vehicle):               # inheritance: a Bike IS a Vehicle\n    pass\n\nclass Rider:                       # composition: a Rider HAS a Bike\n    def __init__(self, bike):\n        self.bike = bike\n\nr = Rider(Bike())\nprint(r.bike.move(), isinstance(r.bike, Vehicle), isinstance(r, Vehicle))   # moving True False","is-a means inheritance, has-a means composition. Having a Bike does not make a Rider a Vehicle."]],["Use None as the default for a list (courses=None) and create the list inside __init__, otherwise all objects share one list.","The contained object keeps its own state: change it through the owner (car.engine.start()).","Composition = has-a (Car has an Engine). Inheritance = is-a (Dog is an Animal)."]]],"extra":{"12":[["class Person:\n    pass\n\np1 = Person()\np1.name = \"Peter\"\np1.age = 20\np2 = Person()\np2.name = \"Sara\"\nprint(p1.name, p1.age, p2.name, hasattr(p2, \"age\"))   # Peter 20 Sara False","An empty class (pass) is still a class. Attributes can be added to single objects at any time, so p2 has no age."],["class MyClass:\n    attr_1 = 10\n\nmy_object = MyClass()\nprint(my_object.attr_1)   # 10\ndel my_object\ntry:\n    print(my_object)\nexcept NameError:\n    print(\"my_object no longer exists\")\nprint(MyClass.attr_1)   # 10","del deletes the name of the object. The class itself is not affected."]],"13":[["class Student:\n    university = \"VU\"\n\n    def __init__(self, name):\n        self.name = name\n\ns1 = Student(\"Peter\")\ns2 = Student(\"John\")\ns1.age = 20            # only s1 gets this property\nprint(hasattr(s1, \"age\"), hasattr(s2, \"age\"))   # True False\ndel s1.age\nprint(hasattr(s1, \"age\"))   # False","A property added to one object belongs to that object only. del removes it again."],["Student.university = \"UvA\"\nprint(s1.university, s2.university)   # UvA UvA\ns1.university = \"TUD\"\nprint(s1.university)   # TUD\ndel s1.university\nprint(s1.university)   # UvA","Changing the class property changes it for every object. After del the object's own value is gone and the class value shows through again."]],"14":[["class Car:\n    dangerous_speed = 150\n\n    def __init__(self, owner, current_speed=0):\n        self.owner = owner\n        self.current_speed = current_speed\n\n    def set_current_speed(self, new_speed):\n        self.current_speed = new_speed\n        if self.current_speed >= Car.dangerous_speed:\n            self.issue_alert()\n\n    def accelerate(self, increment):\n        self.set_current_speed(self.current_speed + increment)\n\n    def issue_alert(self):\n        print(f\"Too fast: {self.current_speed} km/h\")\n\ncar = Car(\"Peter\")\ncar.accelerate(100)\ncar.accelerate(60)\nprint(car.current_speed)   # 160","Methods can call other methods with self, and compare with a class property (Car.dangerous_speed)."],["class Student:\n    def greet(self):\n        return \"hello\"\n\ns = Student()\nprint(s.greet())   # hello\ndel Student.greet\ntry:\n    s.greet()\nexcept AttributeError:\n    print(\"greet() is gone\")","del Class.method removes a method from the class, so every object loses it."]]}};const OOP2REF=["self.__age = age :: private attribute (two underscores): not meant to be used outside the class\nself._age = age :: one underscore is only a convention for \"internal\", it is not private\ndef __check(self, v): :: private method: only called inside the class, as self.__check(v)\ndef get_age(self): :: getter: returns the private value\ndef set_age(self, new): :: setter: validates the new value before storing it\nobj.__age :: from outside the class this raises an AttributeError\nobj.__age = 35 :: outside the class this creates a NEW attribute; the private value stays unchanged\nname mangling :: inside class Employee, __age is stored as _Employee__age\nobj._Employee__age :: still reachable: Python privacy is a convention, not strict like in Java\nif self.__is_valid(x): :: use a private validation method inside the setter\n0 <= grade <= 10 :: chained comparison, a common validation\nisinstance(x, (int, float)) :: check the type before accepting a value\nprint(\"error\") / return None :: what to do when the value is not valid\nobj.__dict__ :: shows the real attribute names, including the mangled ones\nencapsulation :: data and methods together in one class, the data protected and its access controlled","__init__(self, ...) :: runs when the object is created\n__str__(self) :: friendly text for print(obj) and str(obj); it must return a string\n__repr__(self) :: developer text for repr(obj), the console and objects inside a list\n__eq__(self, other) :: what a == b does\n__lt__(self, other) :: what a < b does; sorted(list_of_objects) uses it\n__add__(self, other) :: what a + b does (it may return any type)\n__len__(self) :: what len(obj) returns\n__contains__(self, item) :: what item in obj does\n__call__(self, ...) :: lets you call the object like a function: obj()\nprint(obj) :: Python calls obj.__str__() for you\nrepr(obj) / [obj1, obj2] :: Python uses __repr__\nsorted(objects) :: needs __lt__ on the objects\na is b :: identity (the very same object); == uses __eq__ when it exists\ndunder :: short for \"double underscore\": you normally do not call these methods yourself","class Outer: class Inner: :: an inner class is a class defined inside another class\nouter.Inner() :: create an inner object through an outer object\nOuter.Inner() :: create an inner object through the class name\nself.Inner() :: inside a method of Outer: create an inner object\nself.engine = self.Engine() :: the outer object keeps its own inner object\ndef __init__(self, outer): (in Inner) :: an inner class does not see the outer object: pass it in yourself\nself.outer.name :: how the inner object reaches data of the outer object\nclass Engine: (not indented) :: a normal class; self.Engine() would raise an AttributeError\ntype(inner).__name__ :: the name of the class of an object\nisinstance(inner, Outer) :: False: an inner class is not a subclass of the outer class\nOuter.Inner.__name__ :: the name of the inner class\nwhen to use :: a class that only makes sense inside another class","self.engine = Engine(fuel) :: composition: the object creates the object it contains\nCar(brand, engine_object) :: or the contained object is passed in from outside\nhas-a relationship :: a Car has an Engine, a Student has a Course\nself.engine.start() :: a method of the outer object calls a method of the contained object\nself.course.name :: reach attributes of the contained object through a chain of dots\nself.courses = [] :: an object can contain a list of other objects\nself.courses.append(record) :: add another contained object\nfor record in self.courses: :: loop over the contained objects\nf\"{self.course}\" :: calls the __str__ of the contained object\nshared object :: the same Course object can belong to several Students; a change shows everywhere\ncourses=None :: use None as default and create [] inside __init__, so objects do not share one list\nis-a vs has-a :: inheritance is-a (Dog is an Animal); composition has-a (Car has an Engine)\nisinstance(student, Course) :: False: containing an object does not make you an instance of its class"];const OOP2REFX={"12":"\ndel obj :: delete the name obj (the class stays)\nclass Name: pass :: an empty class; attributes can still be added to single objects\np1.name = \"Peter\" :: add a property to this object only; other objects do not get it","13":"\ndel obj.attr :: remove an instance attribute; the class attribute (if any) shows through again\nStudent.university = \"UvA\" :: change a class property for every object that has no own value","14":"\ndel Class.method :: remove a method from the class (all objects lose it)\nself.set_speed(self.speed + k) :: a method calling another method of the same object"};const OOP2OPEN=[[17,"Create a class Student with the public attributes name and student_id and a private attribute grade (always between 0 and 10). Add a private method __is_valid_grade(grade), a getter get_grade(), a setter set_grade(new_grade) that only updates a valid grade (otherwise it prints an error) and a method display_info(). Test it with Martijn, S12345, 8.5, then set 9.0 and 10.5.","class Student:\n    def __init__(self, name, student_id, grade):\n        self.name = name\n        self.student_id = student_id\n        self.__grade = grade\n\n    def __is_valid_grade(self, grade):\n        return 0 <= grade <= 10\n\n    def get_grade(self):\n        return self.__grade\n\n    def set_grade(self, new_grade):\n        if self.__is_valid_grade(new_grade):\n            self.__grade = new_grade\n            print(f\"Grade updated to {self.__grade}\")\n        else:\n            print(\"Invalid grade! Grade must be between 0 and 10.\")\n\n    def display_info(self):\n        print(self.name, self.student_id, self.__grade)\n\ns = Student(\"Martijn\", \"S12345\", 8.5)\ns.display_info()\ns.set_grade(9.0)\ns.set_grade(10.5)\ns.display_info()"],[17,"Add a method increase_grade(amount) to the Student class that raises the grade by amount without going above 10. Use the private validation method.","class Student:\n    def __init__(self, grade):\n        self.__grade = grade\n\n    def __is_valid_grade(self, grade):\n        return 0 <= grade <= 10\n\n    def increase_grade(self, amount):\n        if self.__is_valid_grade(self.__grade + amount):\n            self.__grade += amount\n        else:\n            print(\"The grade cannot be higher than 10.\")\n\n    def get_grade(self):\n        return self.__grade\n\ns = Student(8)\ns.increase_grade(1.5)\ns.increase_grade(2)\nprint(s.get_grade())"],[17,"Write a class Employee with a private salary. The setter must only accept a positive salary and print \"Salary must be positive.\" otherwise. Add a getter and test both a valid and an invalid value.","class Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.__salary = salary\n\n    def get_salary(self):\n        return self.__salary\n\n    def set_salary(self, new_salary):\n        if new_salary > 0:\n            self.__salary = new_salary\n        else:\n            print(\"Salary must be positive.\")\n\ne = Employee(\"Peter\", 4500)\ne.set_salary(5000)\ne.set_salary(-5000)\nprint(e.get_salary())"],[18,"Write a class StudentRecord(name, scores) where scores is a dictionary. Add __str__, __eq__, __add__ (the sum of both totals), __len__ and __lt__ (compare the totals). Create three records and print them in sorted order.","class StudentRecord:\n    def __init__(self, name, scores):\n        self.name = name\n        self.scores = scores\n\n    def total(self):\n        return sum(self.scores.values())\n\n    def __str__(self):\n        return f\"{self.name}: {self.total()}\"\n\n    def __eq__(self, other):\n        return self.name == other.name and self.scores == other.scores\n\n    def __add__(self, other):\n        return self.total() + other.total()\n\n    def __len__(self):\n        return len(self.scores)\n\n    def __lt__(self, other):\n        return self.total() < other.total()\n\nrecords = [StudentRecord(\"Peter\", {\"math\": 80, \"art\": 70}), StudentRecord(\"Ben\", {\"math\": 75, \"art\": 60}), StudentRecord(\"Sara\", {\"math\": 85, \"art\": 90})]\nfor r in sorted(records):\n    print(r)\nprint(records[0] + records[1], len(records[0]))"],[18,"Add __contains__ and __call__ to a class Basket(items, a dictionary of item -> price) so that \"apple\" in basket tells whether the item exists and basket() returns the total price.","class Basket:\n    def __init__(self, items):\n        self.items = items\n\n    def __contains__(self, item):\n        return item in self.items\n\n    def __call__(self):\n        return sum(self.items.values())\n\nb = Basket({\"apple\": 2, \"pear\": 3})\nprint(\"apple\" in b, \"fig\" in b, b())"],[19,"Create a class Car with an inner class Engine. The engine starts with status \"Off\" and has start() and stop() methods. The car creates its own engine and has a drive() method that only drives when the engine is running (otherwise it prints \"Start the engine first!\").","class Car:\n    def __init__(self, brand, model):\n        self.brand = brand\n        self.model = model\n        self.engine = self.Engine()\n\n    class Engine:\n        def __init__(self):\n            self.status = \"Off\"\n\n        def start(self):\n            self.status = \"Running\"\n            print(\"Engine started\")\n\n        def stop(self):\n            self.status = \"Off\"\n            print(\"Engine stopped\")\n\n    def drive(self):\n        if self.engine.status == \"Running\":\n            print(f\"Driving the {self.brand} {self.model}\")\n        else:\n            print(\"Start the engine first!\")\n\ncar = Car(\"Toyota\", \"Corolla\")\ncar.drive()\ncar.engine.start()\ncar.drive()\ncar.engine.stop()\ncar.drive()"],[19,"Make a class Person(name, city) with an inner class Job(person, company) whose display() prints for example: Peter from Amsterdam works at VU. The inner object needs the outer object.","class Person:\n    def __init__(self, name, city):\n        self.name = name\n        self.city = city\n\n    class Job:\n        def __init__(self, person, company):\n            self.person = person\n            self.company = company\n\n        def display(self):\n            print(f\"{self.person.name} from {self.person.city} works at {self.company}\")\n\np = Person(\"Peter\", \"Amsterdam\")\njob = p.Job(p, \"VU\")\njob.display()"],[20,"Use composition: create the classes Course(course_name, grade), Courses(year, semester, course) and Student(name, country) with a list of Courses records, an add_course() method and a display() method. Create Peter from the Netherlands with two course records and display him.","class Course:\n    def __init__(self, course_name, grade):\n        self.course_name = course_name\n        self.grade = grade\n\n    def __str__(self):\n        return f\"{self.course_name} (Grade: {self.grade})\"\n\nclass Courses:\n    def __init__(self, year, semester, course):\n        self.year = year\n        self.semester = semester\n        self.course = course\n\n    def __str__(self):\n        return f\"{self.year}, Semester {self.semester}: {self.course}\"\n\nclass Student:\n    def __init__(self, name, country):\n        self.name = name\n        self.country = country\n        self.courses = []\n\n    def add_course(self, record):\n        self.courses.append(record)\n\n    def display(self):\n        print(f\"Student: {self.name}\")\n        print(f\"Country: {self.country}\")\n        print(\"Courses:\")\n        for record in self.courses:\n            print(\"  \" + str(record))\n\npeter = Student(\"Peter\", \"Netherlands\")\npeter.add_course(Courses(2026, 1, Course(\"Python Programming\", 8)))\npeter.add_course(Courses(2026, 2, Course(\"Data Science\", 9)))\npeter.display()"],[20,"Write the classes Engine(fuel_type) with start() and Car(brand, fuel_type). The Car creates its own Engine (composition) and has a start_car() method that prints a message and then starts the engine.","class Engine:\n    def __init__(self, fuel_type):\n        self.fuel_type = fuel_type\n\n    def start(self):\n        print(f\"The {self.fuel_type} engine has started.\")\n\nclass Car:\n    def __init__(self, brand, fuel_type):\n        self.brand = brand\n        self.engine = Engine(fuel_type)\n\n    def start_car(self):\n        print(f\"Starting the {self.brand}\")\n        self.engine.start()\n\nCar(\"Toyota\", \"Petrol\").start_car()"],[14,"Write a class Car with a class property dangerous_speed = 150, a current_speed and the methods set_current_speed(new_speed), accelerate(increment) and issue_alert(). The alert must be printed when the speed reaches the dangerous speed.","class Car:\n    dangerous_speed = 150\n\n    def __init__(self, owner, current_speed=0):\n        self.owner = owner\n        self.current_speed = current_speed\n\n    def set_current_speed(self, new_speed):\n        self.current_speed = new_speed\n        if self.current_speed >= Car.dangerous_speed:\n            self.issue_alert()\n\n    def accelerate(self, increment):\n        self.set_current_speed(self.current_speed + increment)\n\n    def issue_alert(self):\n        print(f\"Careful! Current speed: {self.current_speed} km/h is too high\")\n\ncar = Car(\"Peter\")\ncar.accelerate(100)\ncar.accelerate(60)"]];const OOP2EXAM=[[5,17,"class P:\n    def __init__(self, v):\n        self.__v = v\n\n    def get(self):\n        return self.__v\n\np = P(5)\np.__v = 9\nprint(p.get(), p.__v)","5 9",["9 9","5 5","AttributeError"],"p.__v = 9 outside the class creates a new attribute. The private value (stored as _P__v) is untouched, so get() still gives 5."],[5,17,"class Student:\n    def __init__(self, grade):\n        self.__grade = grade\n\n    def __valid(self, g):\n        return 0 <= g <= 10\n\n    def set_grade(self, g):\n        if self.__valid(g):\n            self.__grade = g\n        else:\n            print(\"Invalid\")\n\n    def get_grade(self):\n        return self.__grade\n\ns = Student(8.5)\ns.set_grade(9)\ns.set_grade(10.5)\nprint(s.get_grade())","Invalid\n9",["9","Invalid\n10.5","Invalid\n8.5"],"9 is valid and is stored. 10.5 is not between 0 and 10, so Invalid is printed and the grade stays 9."],[5,18,"class Rec:\n    def __init__(self, scores):\n        self.scores = scores\n\n    def __len__(self):\n        return len(self.scores)\n\n    def __contains__(self, k):\n        return k in self.scores\n\n    def __call__(self):\n        return sum(self.scores.values()) / len(self)\n\nr = Rec({\"math\": 8, \"art\": 6, \"pe\": 7})\nprint(len(r), \"art\" in r, \"bio\" in r, r())","3 True False 7.0",["3 True False 7","3 False True 7.0","21 True False 7.0"],"len(r) calls __len__ (3), in calls __contains__ (True for art, False for bio) and r() calls __call__: 21 / 3 = 7.0."],[5,18,"class Box:\n    def __init__(self, v):\n        self.v = v\n\n    def __lt__(self, other):\n        return self.v < other.v\n\n    def __repr__(self):\n        return f\"Box({self.v})\"\n\nprint(sorted([Box(3), Box(1), Box(2)]), Box(1) < Box(2))","[Box(1), Box(2), Box(3)] True",["[Box(3), Box(1), Box(2)] True","[Box(1), Box(2), Box(3)] False","[Box(3), Box(2), Box(1)] True"],"sorted uses __lt__, so the boxes are ordered by v. The list is shown with __repr__. Box(1) < Box(2) is True."],[5,19,"class Car:\n    def __init__(self):\n        self.engine = self.Engine()\n\n    class Engine:\n        def __init__(self):\n            self.status = \"Off\"\n\n        def start(self):\n            self.status = \"Running\"\n\nc = Car()\nprint(c.engine.status)\nc.engine.start()\nprint(c.engine.status, type(c.engine).__name__)","Off\nRunning Engine",["Off\nRunning Car","Running\nRunning Engine","Off\nOff Engine"],"The Car creates an object of its inner class Engine. It starts as Off. start() changes it to Running, and the object is of class Engine."],[5,19,"class Outer:\n    def __init__(self, name):\n        self.name = name\n\n    class Inner:\n        def __init__(self, outer, n):\n            self.outer = outer\n            self.n = n\n\n        def show(self):\n            return f\"{self.outer.name}-{self.n}\"\n\na = Outer(\"A\")\ni = a.Inner(a, 1)\na.name = \"Z\"\nprint(i.show())","Z-1",["A-1","Z-A","A-Z"],"The inner object stores a reference to the outer object, not a copy. The name was changed to Z before show() ran, so it gives Z-1."],[5,20,"class Course:\n    def __init__(self, grade):\n        self.grade = grade\n\nclass Student:\n    def __init__(self, name, course):\n        self.name = name\n        self.course = course\n\nc = Course(7)\ns1 = Student(\"Ana\", c)\ns2 = Student(\"Bob\", c)\nc.grade += 2\ns1.course.grade += 1\nprint(s1.course.grade, s2.course.grade, c.grade)","10 10 10",["9 9 9","10 9 9","8 7 9"],"Both students contain the same Course object. 7 + 2 + 1 = 10, and every way of reaching it shows 10."],[5,20,"class Course:\n    def __init__(self, name, grade):\n        self.name = name\n        self.grade = grade\n\n
